[project]
name = "rag-against-the-machine"
version = "1.0.0"
description = "A Retrieval-Augmented Generation system to query codebases"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "aunoguei" }
]

dependencies = [
    "fire>=0.6.0",
    "pydantic>=2.7.0",
    "tqdm>=4.66.0",
    "bm25s>=0.2.0",
    "numpy>=1.24.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "flake8-pyproject>=1.2.3"
]


# --------------------------
# LINTING & TOOLS CONFIG
# --------------------------

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".mypy_cache",
    "data"
]